# Minimal Keycloak + Postgres stack for local frontend development.
#
# Pairs with VITE_USE_MOCKS=1 — the SPA talks to a real Keycloak (so the
# PKCE login flow is authentic) but every /api/v1/* request is intercepted
# by MSW in the browser. No webapi, no operator, no minikube.
#
# See docs/dev-quickstart.md for the full workflow.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    # Pinned to a known-good 26.x release. Bump intentionally when needed —
    # the realm export is validated by the Keycloak import step on startup.
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      # Mount the same realm export used by the minikube path. Keycloak picks
      # up everything under /opt/keycloak/data/import when started with
      # --import-realm.
      - ../keycloak/nebari-realm.json:/opt/keycloak/data/import/nebari-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keycloak-pg:
