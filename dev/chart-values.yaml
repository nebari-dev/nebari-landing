# dev/chart-values.yaml — Helm values overrides for local minikube dev
#
# Usage:
#   helm upgrade --install nebari-landing charts/nebari-landing \
#     --namespace nebari-system \
#     --values dev/chart-values.yaml
#
# The Makefile 'install' target uses this file automatically.
#
# Pre-requisites (already created by other make targets):
#   Secret nebari-realm-admin-credentials  (make postgresql-secrets)
#     keys: username, password

# ---------------------------------------------------------------------------
# Webapi
# ---------------------------------------------------------------------------
webapi:
  image:
    # Image loaded into minikube by 'make image-build'
    repository: nebari-landing/webapi
    tag: dev
    # Never pull — image only exists inside minikube
    pullPolicy: Never

  keycloak:
    # Cluster-internal URL for back-channel calls (JWKS fetch, admin API)
    # keycloakx chart v7+ exposes the service on httpPort (8080), not the HTTP default 80.
    url: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080"
    # Issuer URL that Keycloak stamps in JWTs (matches KC_HOSTNAME_URL in values.yaml)
    issuerUrl: "http://localhost:8180"
    realm: "nebari"
    # SPA access tokens must be bound to this API audience and frontend client.
    audience: "nebari-landingpage"
    authorizedParty: "nebari-frontend-spa"
    enableAuth: true
    adminGroup: "admin"
    adminSecretName: "nebari-realm-admin-credentials"
    adminSecretNamespace: "keycloak"

  # Set debugMode: true to activate GET /api/v1/debug and verbose JWT logging.
  # Useful when authenticated services don't show up — the endpoint reveals
  # whether the Authorization header reached the webapi and whether the JWT
  # validated successfully.  Access via:
  #   kubectl -n nebari-system port-forward svc/nebari-landing-webapi 8090:8080
  #   curl http://localhost:8090/api/v1/debug        # unauthenticated view
  #   curl -H "Authorization: Bearer <token>" http://localhost:8090/api/v1/debug
  # Never enable in production.
  debugMode: false

  # Automatic notifications — both default to true; set false to opt out.
  # notifications:
  #   startupNotification: false    # disable the welcome message on restart
  #   lifecycleNotifications: false # disable service added/removed/back-online posts

  # Expose via MetalLB so 'make port-forward' and direct LB access both work
  service:
    type: LoadBalancer

# ---------------------------------------------------------------------------
# NebariApp CRs — disabled for local dev (nebari-operator not running)
# ---------------------------------------------------------------------------
nebariApp:
  enabled: false

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------
frontend:
  image:
    # Image loaded into minikube by 'make image-build'
    repository: nebari-landing/nebari-landing
    tag: dev
    pullPolicy: Never

  keycloak:
    # Browser-visible Keycloak URL — exposed via port-forward at localhost:8180
    url: "http://localhost:8180"
    realm: "nebari"
    clientId: "nebari-frontend-spa"

  # Expose via MetalLB LoadBalancer
  service:
    type: LoadBalancer

# ---------------------------------------------------------------------------
# Redis subchart (bitnami/redis)
# Auth disabled for dev — no password needed
# Persistence disabled — data is ephemeral; cluster restarts wipe it (fine for dev)
# ---------------------------------------------------------------------------
redis:
  enabled: true
  auth:
    enabled: false
  architecture: standalone
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# ---------------------------------------------------------------------------
# No Envoy Gateway in minikube — disable the HTTPRoute
# Services are reached via MetalLB LB IPs or kubectl port-forward
# ---------------------------------------------------------------------------
httpRoute:
  enabled: false
