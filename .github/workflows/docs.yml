name: Docs
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check-links.sh', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check-links.sh', '.github/workflows/docs.yml']
  workflow_dispatch:

# GitHub Pages deploy needs contents:read to check out, pages:write to publish,
# and id-token:write for the OIDC token that actions/deploy-pages exchanges.
permissions:
  contents: read
  pages: write
  id-token: write

# One pages deploy at a time. Do not cancel a running deploy - it can leave
# the site in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Public URL the built site knows itself by. GitHub Pages under an org
  # serves project sites at https://<owner>.github.io/<repo>/, so BASE is
  # /<repo>/ and SITE is the origin.
  SITE: https://nebari-dev.github.io
  BASE: /nebari-landing/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install deps
        working-directory: docs
        run: npm ci

      - name: Install Playwright (mermaid rendering)
        working-directory: docs
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        working-directory: docs
        run: npm test

      - name: Build
        working-directory: docs
        env:
          SITE: ${{ env.SITE }}
          BASE: ${{ env.BASE }}
        run: npm run build

      - name: Check internal links
        env:
          BASE: ${{ env.BASE }}
        run: SKIP_BUILD=1 bash scripts/check-links.sh

      # Pages artifact upload happens on every build (PR + push) so the
      # artifact is always available for inspection; only the main-branch
      # deploy job actually publishes it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only main-branch pushes actually publish. PR builds stop at the
    # build+link-check gate above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
