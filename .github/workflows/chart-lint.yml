name: Helm chart lint

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - internal/staticservices/testdata/**
      - .github/workflows/chart-lint.yml
  pull_request:
    branches: [main]
    paths:
      - charts/**
      - internal/staticservices/testdata/**
      - .github/workflows/chart-lint.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Build Helm dependencies
        run: helm dependency build charts/nebari-landing

      - name: Lint Helm chart
        run: helm lint charts/nebari-landing

      - name: Assert rendered resource defaults
        run: |
          helm template nebari-landing charts/nebari-landing --namespace nebari-system \
            | ruby charts/nebari-landing/tests/assert-resource-defaults.rb

      - name: Assert opt-in NetworkPolicy render
        env:
          EXPECT_NETWORK_POLICIES: webapi,health-prober
          EXPECTED_WEBAPI_API_CIDR: 172.20.0.1/32
        run: |
          helm template nebari-landing charts/nebari-landing --namespace nebari-system \
            --set webapi.networkPolicy.enabled=true \
            --set webapi.healthProber.networkPolicy.enabled=true \
            --set "webapi.networkPolicy.egress.kubernetesAPI.cidrs={${EXPECTED_WEBAPI_API_CIDR}}" \
            | ruby charts/nebari-landing/tests/assert-resource-defaults.rb

      - name: Assert unsafe values fail to render
        run: charts/nebari-landing/tests/assert-render-failures.sh

      - name: Assert static services rendering
        run: charts/nebari-landing/tests/assert-static-services.sh
