# frontend — CI/CD
#
# Triggers:
#   push to main        → lint → build → multi-arch push (:latest + :<sha>)
#   pull_request        → same gates → multi-arch push (:<branch>) → PR comment
#   workflow_dispatch   → same as push to main
#
# Images are pushed to quay.io/nebari/nebari-landing
# For semver-tagged releases see .github/workflows/release.yml

name: frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
      - .github/workflows/docker-image.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
      - .github/workflows/docker-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run ci

  # ── Unit tests ─────────────────────────────────────────────────────────────
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + Vite build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Container image ───────────────────────────────────────────────────────
  docker:
    name: Docker image
    needs: build
    uses: ./.github/workflows/docker-image.yml
    with:
      component: frontend
      registry: quay.io
      image_name: nebari/nebari-landing
      context: frontend
      dockerfile: frontend/Dockerfile
      cache_scope: frontend
      artifact_prefix: frontend
      is_pull_request: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
