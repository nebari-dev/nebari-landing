# Release prep — orchestrates a chart release without manual sed-ing.
#
# Inputs a release version (e.g. "0.1.0-alpha.6", no leading v). The workflow:
#   1. Validates the version against a semver pattern.
#   2. Refuses to overwrite an existing tag.
#   3. Branches from main into release/v<version>.
#   4. Bumps charts/nebari-landing/Chart.yaml: version and appVersion to the
#      release version (no v prefix — matches the Quay tag scheme set by
#      docker/metadata-action's type=semver,pattern={{version}}).
#   5. Commits "chore: prepare chart for v<version>" on the release branch.
#   6. Pushes the branch and tags v<version> at its HEAD.
#   7. Push of the tag triggers release.yml, which builds Quay images
#      (already tagged 0.1.0-alpha.X via docker/metadata-action) and packages
#      the Helm chart from the release-branch source — values.yaml's empty
#      tag fields fall back to .Chart.AppVersion = 0.1.0-alpha.X, pinning the
#      image references in the published .tgz.
#
# main is intentionally untouched. The release commit lives on the release
# branch and tag only. After the tag's release.yml run finishes, the
# release/v<version> branch can be deleted via the GitHub UI; the tag is the
# only source-of-truth artifact downstream consumers care about.

name: Release prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no leading v (e.g. 0.1.0-alpha.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prep:
    name: Bump chart and tag release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "✗ '$VERSION' is not a valid semver (e.g. 0.1.0 or 0.1.0-alpha.6)."
            echo "  Drop any leading 'v' — the workflow adds it when creating the tag."
            exit 1
          fi
          echo "✔ version $VERSION is valid"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
             || git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "✗ tag ${TAG} already exists"
            exit 1
          fi
          echo "✔ tag ${TAG} is available"

      - name: Bump Chart.yaml on release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"

          sed -i -E "s/^version: .*/version: ${VERSION}/" charts/nebari-landing/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/nebari-landing/Chart.yaml

          echo "--- Chart.yaml after bump ---"
          grep -E "^(version|appVersion):" charts/nebari-landing/Chart.yaml

          git add charts/nebari-landing/Chart.yaml
          git commit -m "chore: prepare chart for v${VERSION}"

      - name: Push branch and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          TAG="v${VERSION}"
          git push origin "${BRANCH}"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"
          echo "✔ pushed ${BRANCH} and ${TAG}"
          echo ""
          echo "release.yml will now run on the tag push and produce:"
          echo "  - quay.io/nebari/nebari-webapi:${VERSION}"
          echo "  - quay.io/nebari/nebari-landing:${VERSION}"
          echo "  - the GoReleaser binaries"
          echo "  - charts/nebari-landing-${VERSION}.tgz attached to the GitHub release"
