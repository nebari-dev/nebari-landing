# Release — Build and publish nebari-landing images + Helm chart
#
# Triggered on: GitHub release published (from the Releases UI or `gh release
# create`). Nothing has to run beforehand: the prepare job pins the chart.
#
# Jobs:
#   prepare           — pin Chart.yaml to the tag's version, move the tag onto
#                       that commit, mark -rc/-alpha/... tags as pre-releases
#   validate-webapi   — go vet + unit tests
#   validate-frontend — Biome lint + Vite build
#   docker-webapi     — multi-arch build of quay.io/nebari/nebari-webapi
#   docker-frontend   — multi-arch build of quay.io/nebari/nebari-landing
#   manifest-webapi   — stitch arch images → semver-tagged manifest
#   manifest-frontend — stitch arch images → semver-tagged manifest
#   goreleaser        — build and release Go binary via GoReleaser
#   publish-chart     — package and attach Helm chart to the GitHub release
#   sync-helm-chart   — sync the published chart to nebari-dev/helm-repository
#
# Note: Helm repository sync is sequenced after publish-chart.

name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: quay.io
  WEBAPI_IMAGE: nebari/nebari-webapi
  FRONTEND_IMAGE: nebari/nebari-landing

jobs:
  # ── Pin the chart to the release tag ──────────────────────────────────────
  # Publishing a release from the UI tags a commit on main, where Chart.yaml
  # carries `version: 0.1.0` / `appVersion: "latest"`. Source consumers (NIC's
  # Argo CD points targetRevision at the git tag) resolve the image tag from
  # appVersion, so the pin has to live in git at the tag, not only in the
  # packaged .tgz.
  #
  # This job commits the bump on top of the tagged commit (detached HEAD, so
  # main is never touched and no branch is created), force-moves the tag onto
  # that commit, and hands the commit SHA to every later job. Every job checks
  # out that SHA rather than github.sha, which still names the pre-bump commit.
  #
  # Idempotent: when the tag already carries the pin (a re-run, or a tag made
  # by hand with the bump in it) nothing is pushed.
  prepare:
    name: Pin chart to release tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like v0.2.0 or v0.2.0-rc.1 (leading v, SemVer after it)."
            exit 1
          fi
          echo "✔ tag $TAG is valid"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Bump Chart.yaml and move the tag
        id: pin
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHART=charts/nebari-landing/Chart.yaml

          # The `^` anchor is load-bearing: Chart.yaml's `dependencies:` block
          # has indented `    version: 23.1.1` entries for the Redis subchart.
          # Without the anchor, awk would pick up that line. Do not
          # "simplify" to a grep.
          pinned() {
            local v a
            v=$(awk '/^version:/ {print $2}' "$CHART")
            a=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' "$CHART")
            echo "version=$v  appVersion=$a  expected=$VERSION"
            [[ "$v" == "$VERSION" && "$a" == "$VERSION" ]]
          }

          if pinned; then
            echo "✔ $TAG already carries the pinned Chart.yaml; nothing to push"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            sed -i -E "s/^version: .*/version: ${VERSION}/" "$CHART"
            sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "$CHART"
            pinned || { echo "::error::sed did not pin $CHART"; exit 1; }

            git add "$CHART"
            git commit -m "chore: prepare chart for ${TAG}"
            git tag -f -a "$TAG" -m "Release ${VERSION}"
            # Pushing the tag carries the otherwise-unreachable bump commit
            # with it; no branch push needed.
            git push --force origin "refs/tags/${TAG}"
            echo "✔ moved $TAG to $(git rev-parse --short HEAD)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A tag with a SemVer pre-release suffix (v0.2.0-rc.1) is a pre-release
      # whether or not the box was ticked in the UI. Flagging it keeps it from
      # being shown as the repo's latest release.
      - name: Mark pre-release
        if: contains(github.event.release.tag_name, '-') && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease

  # ── Validate webapi ────────────────────────────────────────────────────────
  validate-webapi:
    name: Validate webapi
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... -race -count=1

  # ── Validate frontend ──────────────────────────────────────────────────────
  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    needs: prepare
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint
        run: npm run lint

      - name: Type-check + Vite build
        run: npm run build

  # ── Multi-arch webapi build ────────────────────────────────────────────────
  docker-webapi:
    name: Build webapi (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare, validate-webapi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WEBAPI_IMAGE }}
          cache-from: type=gha,scope=webapi-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=webapi-${{ matrix.arch }}
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webapi-release-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Multi-arch frontend build ──────────────────────────────────────────────
  docker-frontend:
    name: Build frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare, validate-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-release-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge webapi arch images → semver-tagged manifest ─────────────────────
  manifest-webapi:
    name: Publish webapi manifest
    runs-on: ubuntu-latest
    needs: docker-webapi
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEBAPI_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: webapi-release-digest-*
          merge-multiple: true

      - name: Create manifest list and push
        run: |
          cd "${{ runner.temp }}/digests"
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')
          TAG_ARGS=""
          for tag in $TAGS; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
          docker buildx imagetools create \
            $TAG_ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.WEBAPI_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.WEBAPI_IMAGE }}:latest"

  # ── Merge frontend arch images → semver-tagged manifest ───────────────────
  manifest-frontend:
    name: Publish frontend manifest
    runs-on: ubuntu-latest
    needs: docker-frontend
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: frontend-release-digest-*
          merge-multiple: true

      - name: Create manifest list and push
        run: |
          cd "${{ runner.temp }}/digests"
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')
          TAG_ARGS=""
          for tag in $TAGS; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
          docker buildx imagetools create \
            $TAG_ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"

  # ── Build and release Go webapi binary ───────────────────────────────────
  goreleaser:
    name: Release Go binary (GoReleaser)
    runs-on: ubuntu-latest
    needs: [prepare, validate-webapi]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0  # GoReleaser needs full history for changelog

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The prepare job may have moved the tag; name it explicitly so
          # GoReleaser does not have to infer it from the checkout.
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}

  # ── Package and attach Helm chart to the GitHub release ───────────────────
  publish-chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: [prepare, manifest-webapi, manifest-frontend]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Verify chart is pinned to release tag
        run: |
          # The prepare job pins Chart.yaml's version and appVersion to the
          # tag and builds every job from that commit. This re-check is a
          # tripwire: if it fails, prepare is broken, and packaging would
          # ship a chart floating on main's appVersion "latest".
          #
          # Note: this check assumes Chart.yaml's `version` and `appVersion`
          # move together (prepare always writes both). If the project
          # ever decouples them, update this check accordingly.
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # The `^` anchor is load-bearing: Chart.yaml's `dependencies:` block
          # has indented `    version: 23.1.1` entries for the Redis subchart.
          # Without the anchor, awk would pick up that line and the comparison
          # below would fail spuriously. Do not "simplify" to a grep.
          CHART_VERSION=$(awk '/^version:/ {print $2}' charts/nebari-landing/Chart.yaml)
          APP_VERSION=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/nebari-landing/Chart.yaml)
          echo "tag=$TAG  expected version=$VERSION  chart version=$CHART_VERSION  appVersion=$APP_VERSION"
          if [[ "$CHART_VERSION" != "$VERSION" || "$APP_VERSION" != "$VERSION" ]]; then
            echo "✗ Chart.yaml is not pinned to the release tag."
            echo "  The prepare job should have pinned it; check its log in this run."
            exit 1
          fi
          echo "✔ Chart.yaml matches the release tag"

      - name: Update Helm dependencies
        run: |
          helm dependency update charts/nebari-landing

      - name: Package Helm chart
        run: |
          helm package charts/nebari-landing --destination dist/

      - name: Attach chart to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          # The git tag is v-prefixed (v0.2.0) but docker/metadata-action's
          # type=semver,pattern={{version}} strips the v before pushing to
          # Quay, so the actual image tag is the unprefixed VERSION. Use
          # that for the summary so the printed pull commands are copy-pasteable.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "### Release ${{ github.event.release.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Images published:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.WEBAPI_IMAGE }}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Helm chart:** \`nebari-landing-${VERSION}.tgz\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms**: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  # ── Sync Helm chart repository after the release artifact is published ────
  sync-helm-chart:
    name: Sync Helm chart repository
    needs: publish-chart
    uses: ./.github/workflows/sync-helm-chart.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      dry-run: false
    secrets: inherit
