# openapi-drift — fails when the committed OpenAPI spec is out of date.
#
# The webapi exposes its OpenAPI 3.1 spec at /api/v1/docs/openapi.json (only
# under --enable-docs).  The spec is embedded from internal/api/docs/, which
# is regenerated by `make generate-docs` from swag annotations on the handlers.
# Without this check, an annotation change without a regenerate leaves the
# served spec stale, which silently breaks downstream consumers (e.g. MSW
# handlers in the frontend kept in sync via the OpenAPI recipe).
#
# Strategy: run the same `make generate-docs` target the developer would, then
# `git diff --exit-code` the generated directory.

name: OpenAPI spec drift

on:
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/api/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/openapi-drift.yml
  pull_request:
    branches: [main]
    paths:
      - cmd/**
      - internal/api/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/openapi-drift.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: openapi spec is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate OpenAPI spec
        run: make generate-docs

      - name: Verify the committed spec matches the generated spec
        run: |
          if ! git diff --exit-code -- internal/api/docs; then
            echo ""
            echo "✗ The committed OpenAPI spec under internal/api/docs/ is out of date."
            echo "  Run 'make generate-docs' locally and commit the result."
            exit 1
          fi
          echo "✔  internal/api/docs is in sync with handler annotations."
