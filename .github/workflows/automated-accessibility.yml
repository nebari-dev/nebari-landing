name: Frontend Accessibility

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-accessibility.yml"
  workflow_dispatch:

jobs:
  playwright-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      PW_SCREENSHOTS: only-on-failure
      PW_OUTPUT_DIR: .playwright/artifacts

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright accessibility/browser tests
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-mock-report
          path: |
            frontend/.playwright/report
            frontend/.playwright/artifacts
            /tmp/frontend-dev.log
