name: Docker image

on:
  workflow_call:
    inputs:
      component:
        description: Component name used in job summaries.
        required: true
        type: string
      registry:
        description: Container registry hostname.
        required: true
        type: string
      image_name:
        description: Image repository name inside the registry.
        required: true
        type: string
      context:
        description: Docker build context.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path.
        required: true
        type: string
      cache_scope:
        description: GitHub Actions cache scope prefix.
        required: true
        type: string
      artifact_prefix:
        description: Digest artifact name prefix.
        required: true
        type: string
      is_pull_request:
        description: Whether the caller was triggered by pull_request.
        required: true
        type: boolean
    secrets:
      QUAY_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        id: login
        continue-on-error: true
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract branch / tag name
        id: branch
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}}"
          TAG=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]//g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest (main)
        id: build-main
        if: >-
          steps.login.outcome == 'success' &&
          inputs.is_pull_request == false
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest (main)
        if: steps.build-main.outcome == 'success'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-main.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest (main)
        if: steps.build-main.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_prefix }}-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push (PR branch tag)
        if: >-
          steps.login.outcome == 'success' &&
          inputs.is_pull_request == true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.branch.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          provenance: false

      - name: Build image (no push)
        if: steps.login.outcome != 'success'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.branch.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          provenance: false

  manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ inputs.is_pull_request == false }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-digest-*
          merge-multiple: true

      - name: Derive short SHA
        id: tag
        run: |
          SHA="${{ github.sha }}"
          echo "sha=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest list
        run: |
          cd "${{ runner.temp }}/digests"
          docker buildx imagetools create \
            --tag "${{ inputs.registry }}/${{ inputs.image_name }}:latest" \
            --tag "${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.sha }}" \
            $(printf '${{ inputs.registry }}/${{ inputs.image_name }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            "${{ inputs.registry }}/${{ inputs.image_name }}:latest"

      - name: Build summary
        run: |
          echo "### ${{ inputs.component }} image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`latest\` | \`${{ inputs.registry }}/${{ inputs.image_name }}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tag.outputs.sha }}\` | \`${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms**: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  manifest-pr:
    name: Publish multi-arch manifest (PR)
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ inputs.is_pull_request == true }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        id: login
        continue-on-error: true
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract branch / tag name
        id: branch
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}}"
          TAG=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]//g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest (PR)
        if: steps.login.outcome == 'success'
        run: |
          TAG="${{ steps.branch.outputs.tag }}"
          docker buildx imagetools create \
            --tag "${{ inputs.registry }}/${{ inputs.image_name }}:${TAG}" \
            "${{ inputs.registry }}/${{ inputs.image_name }}:${TAG}-amd64" \
            "${{ inputs.registry }}/${{ inputs.image_name }}:${TAG}-arm64"

      - name: Upsert PR build comment
        if: steps.login.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- nebari-landing-pr-build -->';
            const tag    = '${{ steps.branch.outputs.tag }}';
            const body   = [
              marker,
              '### Docker images built for this PR',
              '',
              `Branch tag: \`${tag}\``,
              '',
              '| Component | Image | Platforms |',
              '|---|---|---|',
              `| **webapi**   | \`quay.io/nebari/nebari-webapi:${tag}\`   | linux/amd64, linux/arm64 |`,
              `| **frontend** | \`quay.io/nebari/nebari-landing:${tag}\` | linux/amd64, linux/arm64 |`,
              '',
              'To deploy this PR locally:',
              '```bash',
              'helm upgrade --install nebari-landing charts/nebari-landing \\',
              '  --namespace nebari-system \\',
              `  --set webapi.image.tag=${tag} \\`,
              `  --set frontend.image.tag=${tag}`,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Build summary
        if: steps.login.outcome == 'success'
        run: |
          echo "### Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch**: ${{ steps.branch.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image**: \`${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.branch.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms**: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
