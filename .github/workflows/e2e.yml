# e2e — runs the Ginkgo end-to-end suite against a real Kubernetes cluster
# bootstrapped by nebari-dev/action-nebari-sandbox (platform profile).
#
# What the platform profile provides:
#   - k3d cluster with MetalLB, cert-manager, Envoy Gateway
#   - Keycloak (keycloakx chart, namespace: keycloak, svc: keycloak-keycloakx-http)
#   - nebari realm pre-configured by NIC
#   - ArgoCD managing all foundational apps
#
# The workflow adds on top:
#   - Builds the webapi Docker image and imports it into k3d
#   - Installs the NebariApp CRD directly (deterministic, no ArgoCD sync wait)
#   - Runs the Ginkgo e2e suite with USE_EXISTING_CLUSTER=true

name: E2E tests

on:
  push:
    branches: [main]
    paths:
      - test/e2e/**
      - internal/**
      - cmd/**
      - charts/**
      - .github/workflows/e2e.yml
  pull_request:
    branches: [main]
    paths:
      - test/e2e/**
      - internal/**
      - cmd/**
      - charts/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e tests
    runs-on: ubuntu-24.04

    # platform bootstrap ~15 min + image build ~2 min + tests ~10 min
    timeout-minutes: 60

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Go toolchain ─────────────────────────────────────────────────────────
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Unified Go cache — covers both e2e test modules and any Go build inside
      # the sandbox action (NIC binary), so the sandbox step benefits too.
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # ── Webapi image (pull from Quay if available, fallback to build) ─────────
      # For PRs, the webapi workflow publishes to quay.io/nebari/nebari-webapi:<branch>
      # Pulling saves ~2min vs building. Falls back to local build for fork PRs.
      - name: Extract branch / tag name
        id: branch
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          TAG=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]//g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pull webapi image from Quay
        id: pull
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE="quay.io/nebari/nebari-webapi:${{ steps.branch.outputs.tag }}"
            echo "Attempting to pull ${IMAGE}..."
            
            # Retry up to 5 minutes (webapi workflow takes ~4min to publish)
            MAX_ATTEMPTS=30
            SLEEP=10
            
            for i in $(seq 1 $MAX_ATTEMPTS); do
              if docker pull "${IMAGE}" 2>&1; then
                docker tag "${IMAGE}" nebari-landing/webapi:dev
                echo "pulled=true" >> "$GITHUB_OUTPUT"
                echo "✓ Pulled ${IMAGE} (attempt $i)"
                exit 0
              fi
              
              if [ $i -lt $MAX_ATTEMPTS ]; then
                echo "⏳ Image not yet available, waiting ${SLEEP}s... (attempt $i/$MAX_ATTEMPTS)"
                sleep $SLEEP
              fi
            done
            
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "✗ Pull failed after $MAX_ATTEMPTS attempts, will build locally"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "Not a PR, will build locally"
          fi

      - name: Set up Docker Buildx
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build webapi image
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: nebari-landing/webapi:dev
          load: true
          cache-from: type=gha,scope=e2e-webapi
          cache-to: type=gha,mode=max,scope=e2e-webapi

      # ── Kubernetes cluster + Nebari platform ─────────────────────────────────
      - name: Setup Nebari Sandbox
        id: sandbox
        uses: nebari-dev/action-nebari-sandbox@v1.0.1
        with:
          profile: platform
          cluster-name: nebari-e2e

      # ── Load webapi image into k3d ────────────────────────────────────────────
      - name: Load webapi image into k3d
        run: k3d image import nebari-landing/webapi:dev -c ${{ steps.sandbox.outputs.cluster-name }}

      # ── NebariApp CRD ─────────────────────────────────────────────────────────
      # Apply directly so the tests don't depend on ArgoCD sync timing.
      - name: Install NebariApp CRD
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/nebari-dev/nebari-operator/main/config/crd/bases/reconcilers.nebari.dev_nebariapps.yaml
          kubectl wait --for=condition=Established \
            crd/nebariapps.reconcilers.nebari.dev \
            --timeout=60s

      # ── Preflight: wait for Keycloak + nebari realm ──────────────────────────
      # The sandbox waits for the keycloak pod to be Ready, but the realm
      # provisioning PostSync hook runs asynchronously and may need a bit
      # more time.  Poll the OIDC discovery endpoint via port-forward (port 8080,
      # which is what keycloakx v7+ exposes on the service) until the realm
      # responds, so the 30 s test timeout doesn't race with realm setup.
      - name: Wait for Keycloak nebari realm
        run: |
          kubectl port-forward -n keycloak svc/keycloak-keycloakx-http 19090:8080 &
          PF_PID=$!
          trap "kill ${PF_PID} 2>/dev/null || true" EXIT
          echo "Polling http://localhost:19090/realms/nebari/.well-known/openid-configuration …"
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
              http://localhost:19090/realms/nebari/.well-known/openid-configuration 2>/dev/null || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "✔  nebari realm ready (HTTP $STATUS)"
              break
            fi
            echo "  attempt $i/60 — HTTP $STATUS, retrying in 5 s …"
            sleep 5
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
            http://localhost:19090/realms/nebari/.well-known/openid-configuration 2>/dev/null || echo 000)
          if [ "$STATUS" != "200" ]; then
            echo "✗  nebari realm did not become ready (last HTTP $STATUS)"
            kill "${PF_PID}" 2>/dev/null || true
            exit 1
          fi
          kill "${PF_PID}" 2>/dev/null || true

      # ── Read nebari realm admin password ─────────────────────────────────────
      # NIC creates nebari-realm-admin-credentials in the keycloak namespace
      # with a randomly-generated password (separate from the master realm admin
      # password output by the sandbox).  Read it here so the e2e tests can
      # authenticate against the nebari realm.
      - name: Read nebari realm admin password
        run: |
          PASS=$(kubectl -n keycloak get secret nebari-realm-admin-credentials \
            -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::${PASS}"
          echo "NEBARI_REALM_ADMIN_PASSWORD=${PASS}" >> "$GITHUB_ENV"

      # ── Wait for webapi deployment ───────────────────────────────────────────
      # After importing the image, the webapi deployment may restart. Wait for
      # it to be stable before running tests to avoid connecting to a pod that's
      # still syncing its watcher cache.
      - name: Wait for webapi to be ready
        run: |
          echo "Waiting for webapi deployment to be ready..."
          kubectl rollout status deployment/nebari-landing-webapi \
            -n nebari-system --timeout=180s
          echo "✓ Webapi ready"

      # ── Debug: Verify webapi image and debug logging ──────────────────────────
      - name: Verify webapi image contains debug logging
        run: |
          echo "=== Checking webapi image for debug logging ==="
          
          # Get current image
          IMAGE=$(kubectl get deployment/nebari-landing-webapi -n nebari-system \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Current image: $IMAGE"
          
          # Get pod info
          POD=$(kubectl get pod -n nebari-system \
            -l app.kubernetes.io/name=nebari-landing-webapi \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Pod: $POD"
          
          # Check image ID
          IMAGE_ID=$(kubectl get pod -n nebari-system $POD \
            -o jsonpath='{.status.containerStatuses[0].imageID}')
          echo "Image ID: $IMAGE_ID"
          
          # Extract binary and check for debug strings
          echo ""
          echo "=== Checking binary for debug strings ==="
          kubectl cp nebari-system/$POD:/app/webapi /tmp/webapi-binary
          
          if strings /tmp/webapi-binary | grep -q "CACHE-DEBUG"; then
            echo "✅ Found [CACHE-DEBUG] strings in binary"
            strings /tmp/webapi-binary | grep "CACHE-DEBUG" | head -3
          else
            echo "❌ NO [CACHE-DEBUG] strings found in binary"
          fi
          
          if strings /tmp/webapi-binary | grep -q "handleGetServices called"; then
            echo "✅ Found [API] debug strings in binary"
            strings /tmp/webapi-binary | grep "handleGetServices" | head -3
          else
            echo "❌ NO [API] debug strings found in binary"
          fi
          
          # Check current logs
          echo ""
          echo "=== Checking webapi logs for debug output ==="
          kubectl logs -n nebari-system -l app.kubernetes.io/name=nebari-landing-webapi \
            --tail=50 | grep -E "INFO|ERROR" | tail -20
          
          echo ""
          echo "=== Checking for [CACHE-DEBUG] in logs ==="
          if kubectl logs -n nebari-system -l app.kubernetes.io/name=nebari-landing-webapi \
            | grep -q "\[CACHE-DEBUG\]"; then
            echo "✅ Found [CACHE-DEBUG] in logs"
            kubectl logs -n nebari-system -l app.kubernetes.io/name=nebari-landing-webapi \
              | grep "\[CACHE-DEBUG\]" | head -5
          else
            echo "❌ NO [CACHE-DEBUG] found in logs"
          fi

      # ── E2E suite ─────────────────────────────────────────────────────────────
      - name: Run e2e tests
        env:
          # Cluster is already running — skip Kind creation and docker build.
          USE_EXISTING_CLUSTER: "true"
          CLUSTER_TYPE: k3d
          K3D_CLUSTER_NAME: ${{ steps.sandbox.outputs.cluster-name }}
          WEBAPI_IMG: nebari-landing/webapi:dev
          # Password for the 'admin' user in the nebari realm (not the master realm).
          E2E_KEYCLOAK_ADMIN_PASSWORD: ${{ env.NEBARI_REALM_ADMIN_PASSWORD }}
        run: go test ./test/e2e/... -tags=e2e -v -timeout 10m

      # ── Diagnostics ───────────────────────────────────────────────────────────
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pods (all namespaces) ==="
          kubectl get pods -A || true
          echo ""
          echo "=== Webapi deployment status ==="
          kubectl get deployment -n nebari-system nebari-landing-webapi -o wide || true
          kubectl describe deployment -n nebari-system nebari-landing-webapi || true
          echo ""
          echo "=== Webapi pods ==="
          kubectl get pods -n nebari-system -l app.kubernetes.io/component=webapi -o wide || true
          echo ""
          echo "=== NebariApp resources ==="
          kubectl get nebariapps -n nebari-system -o wide || true
          echo ""
          echo "=== NebariApp details ==="
          for app in $(kubectl get nebariapps -n nebari-system -o name 2>/dev/null); do
            echo "--- $app ---"
            kubectl get "$app" -n nebari-system -o yaml || true
          done
          echo ""
          echo "=== Test Service (backing service for NebariApps) ==="
          kubectl get service test-service -n nebari-system -o yaml 2>/dev/null || echo "test-service not found"
          echo ""
          echo "=== Recent warning events ==="
          kubectl get events -A --field-selector type=Warning \
            --sort-by='.lastTimestamp' 2>/dev/null | tail -50 || true
          echo ""
          echo "=== Webapi logs (last 200 lines) ==="
          kubectl logs -n nebari-system \
            -l app.kubernetes.io/component=webapi --tail=200 || true
          echo ""
          echo "=== Webapi logs showing cache operations ==="
          kubectl logs -n nebari-system \
            -l app.kubernetes.io/component=webapi --tail=500 | grep -E "(Service added|Service updated|Service deleted|Service removed|total:|Reconcile)" || true
          echo ""
          echo "=== ArgoCD applications ==="
          kubectl get applications -n argocd -o wide || true
          echo ""
          echo "=== Test /api/v1/services endpoint directly ==="
          POD=$(kubectl get pods -n nebari-system -l app.kubernetes.io/component=webapi -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$POD" ]; then
            echo "Testing API from pod: $POD"
            kubectl exec -n nebari-system "$POD" -- curl -s http://localhost:8080/api/v1/services | jq '.' || true
          fi

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}
          docker network rm ${{ steps.sandbox.outputs.network-name }} 2>/dev/null || true
