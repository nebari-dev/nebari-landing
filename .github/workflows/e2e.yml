# e2e — runs the Ginkgo end-to-end suite against a real Kubernetes cluster
# bootstrapped by nebari-dev/action-nebari-sandbox (platform profile).
#
# What the platform profile provides:
#   - k3d cluster with MetalLB, cert-manager, Envoy Gateway
#   - Keycloak (keycloakx chart, namespace: keycloak, svc: keycloak-keycloakx-http)
#   - nebari realm pre-configured by NIC
#   - ArgoCD managing all foundational apps
#
# The workflow adds on top:
#   - Builds the webapi Docker image and imports it into k3d
#   - Installs the NebariApp CRD directly (deterministic, no ArgoCD sync wait)
#   - Runs the Ginkgo e2e suite with USE_EXISTING_CLUSTER=true

name: E2E tests

on:
  push:
    branches: [main]
    paths:
      - test/e2e/**
      - internal/**
      - cmd/**
      - charts/**
      - .github/workflows/e2e.yml
  pull_request:
    branches: [main]
    paths:
      - test/e2e/**
      - internal/**
      - cmd/**
      - charts/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e tests
    runs-on: ubuntu-24.04

    # platform bootstrap ~15 min + image build ~2 min + tests ~10 min
    timeout-minutes: 60

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Go toolchain ─────────────────────────────────────────────────────────
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Unified Go cache — covers both e2e test modules and any Go build inside
      # the sandbox action (NIC binary), so the sandbox step benefits too.
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      # ── Webapi image tag (published by webapi.yml) ───────────────────────────
      # webapi.yml uses different tagging schemes for the two event types:
      #   - pull_request → quay.io/nebari/nebari-webapi:<branch-tag>
      #     (sanitised head ref, set by the "manifest (PR)" job)
      #   - push to main → quay.io/nebari/nebari-webapi:<short-sha> + :latest
      #     (no branch-named tag is pushed on main, so falling back to the
      #     short SHA matches what the upstream workflow actually publishes)
      # Reuse whichever tag exists for the event we are running under so we
      # are not building a second webapi locally.
      - name: Compute webapi image tag
        id: branch
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF}"
            TAG=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]//g')
          else
            TAG="${GITHUB_SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "  resolved tag: $TAG (event: $GITHUB_EVENT_NAME)"

      # ── Kubernetes cluster + Nebari platform ─────────────────────────────────
      # The image override below is applied via a Git commit to the local
      # file:// gitops repo ArgoCD reads from, so ArgoCD's auto-sync converges
      # on it as desired state — no cluster-side patch to revert, no need for
      # an argocd-self-heal toggle. Pinned to @main until v1.1+ is cut.
      - name: Setup Nebari Sandbox
        id: sandbox
        uses: nebari-dev/action-nebari-sandbox@main
        with:
          profile: platform
          cluster-name: nebari-e2e

      # ── Wait for the resolved webapi image on Quay ───────────────────────────
      # webapi.yml runs in parallel with this workflow on the same SHA. Block
      # here until its manifest job has published the tag (branch-named on PRs,
      # short-SHA on main pushes) so the rollout step below has something to
      # pull.
      - name: Wait for webapi image on Quay
        run: |
          IMAGE="quay.io/nebari/nebari-webapi:${{ steps.branch.outputs.tag }}"
          for i in $(seq 1 60); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "✔ $IMAGE is available"
              exit 0
            fi
            echo "  attempt $i/60 — waiting for $IMAGE …"
            sleep 10
          done
          echo "✗ $IMAGE never became available"
          exit 1

      # ── NebariApp CRD ─────────────────────────────────────────────────────────
      # Apply directly so the tests don't depend on ArgoCD sync timing.
      - name: Install NebariApp CRD
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/nebari-dev/nebari-operator/main/config/crd/bases/reconcilers.nebari.dev_nebariapps.yaml
          kubectl wait --for=condition=Established \
            crd/nebariapps.reconcilers.nebari.dev \
            --timeout=60s

      # ── Preflight: wait for the realm-setup Job to complete ──────────────────
      # The sandbox waits for the keycloak pod to be Ready, which only covers
      # "the chart deployed".  The nebari realm itself comes from a separate
      # post-sync Job (NIC: pkg/argocd/templates/manifests/keycloak/realm-setup-job.yaml)
      # that ArgoCD doesn't gate the keycloak app's Healthy status on, so we
      # have to wait on the Job directly. On failure we dump pod logs so the
      # CI run shows why provisioning didn't finish instead of just timing out.
      #
      # Drop this step once nebari-dev/action-nebari-sandbox#27 lands and the
      # sandbox itself can wait for realm-readiness.
      - name: Wait for Keycloak realm-setup Job
        run: |
          if ! kubectl wait --for=condition=complete \
                 job/keycloak-realm-setup -n keycloak --timeout=10m; then
            echo "✗  keycloak-realm-setup did not complete; dumping diagnostics:"
            kubectl describe job/keycloak-realm-setup -n keycloak || true
            kubectl logs -n keycloak job/keycloak-realm-setup --tail=200 || true
            exit 1
          fi
          echo "✔  keycloak-realm-setup Job complete — nebari realm is provisioned"

      # ── Preflight: wait for the operator-provisioned OIDC client secret ──────
      # nebari-operator creates nebari-landing-oidc-client when it reconciles
      # the NebariApp resource that the platform profile's nebari-landingpage
      # Argo app applies. Reconciliation can only start after we install the
      # CRD (above), so the secret typically appears 10-60s after the realm-
      # setup Job completes. setup-keycloak-e2e.sh below reads it, so block
      # here until it exists or the operator visibly stalls.
      - name: Wait for nebari-landing OIDC client secret
        run: |
          for i in $(seq 1 60); do
            if kubectl -n nebari-system get secret nebari-landing-oidc-client >/dev/null 2>&1; then
              echo "✔  nebari-landing-oidc-client present"
              exit 0
            fi
            echo "  attempt $i/60 — secret not yet created, retrying in 5 s …"
            sleep 5
          done
          echo "✗  nebari-landing-oidc-client never appeared; dumping diagnostics:"
          kubectl -n nebari-system get secrets || true
          kubectl -n argocd get application nebari-landingpage -o yaml 2>/dev/null | head -80 || true
          exit 1

      # ── Swap webapi to the PR-tagged image (via GitOps source) ──────────────
      # Patch the local file:// GitOps repo that ArgoCD reads from so Git
      # itself becomes the source of truth for the PR image. A direct
      # `kubectl set image` is not enough — ArgoCD's reconciler still
      # auto-syncs the Application on its periodic refresh and reverts
      # cluster-side patches even with selfHeal off.
      - name: Override webapi image in GitOps source
        env:
          GITOPS_DIR: ${{ steps.sandbox.outputs.gitops-dir }}
          NEW_TAG: ${{ steps.branch.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GITOPS_DIR}" || ! -d "${GITOPS_DIR}" ]]; then
            echo "✗ gitops-dir not set or not a directory: ${GITOPS_DIR:-<empty>}"
            exit 1
          fi

          # NIC writes manifests as Git objects but does not leave a checked-out
          # working tree, so a plain grep finds nothing. Dump repo state then
          # populate the working tree on the branch ArgoCD reads from.
          export GIT_CONFIG_GLOBAL=/dev/null
          git -C "${GITOPS_DIR}" config --local --add safe.directory "${GITOPS_DIR}" || true

          echo "::group::GitOps repo state"
          echo "--- branches ---"
          git -C "${GITOPS_DIR}" branch -a || true
          echo "--- HEAD ---"
          git -C "${GITOPS_DIR}" rev-parse --abbrev-ref HEAD || true
          git -C "${GITOPS_DIR}" log --oneline -5 HEAD || true
          echo "--- ls-tree -r HEAD (first 50) ---"
          git -C "${GITOPS_DIR}" ls-tree -r HEAD --name-only | head -50 || true
          echo "::endgroup::"

          # Pick the branch ArgoCD reads from (main per NIC config), falling
          # back to HEAD if main does not exist on this NIC build.
          BRANCH=main
          if ! git -C "${GITOPS_DIR}" rev-parse --verify "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            BRANCH=$(git -C "${GITOPS_DIR}" rev-parse --abbrev-ref HEAD)
            echo "  (no 'main' branch — falling back to HEAD branch: ${BRANCH})"
          fi

          echo "::group::Populate working tree from ${BRANCH}"
          # Switch to the branch (if needed) and force a checkout so manifest
          # files appear in the working tree.
          git -C "${GITOPS_DIR}" checkout -f "${BRANCH}" 2>&1 || true
          git -C "${GITOPS_DIR}" status --short | head -20 || true
          echo "--- working tree files (top 30) ---"
          find "${GITOPS_DIR}" -maxdepth 6 -type f -not -path '*/\.git/*' | head -30 || true
          echo "::endgroup::"

          # The chart's image is pinned by targetRevision (v0.1.0-alpha.4) and
          # the gitops repo's Application does not redeclare it. Override the
          # image tag by injecting into the existing inline values block of
          # apps/nebari-landingpage.yaml.
          APP_FILE="${GITOPS_DIR}/apps/nebari-landingpage.yaml"
          if [[ ! -f "${APP_FILE}" ]]; then
            echo "✗ expected Application file not found: ${APP_FILE}"
            exit 1
          fi

          echo "::group::Inject webapi.image override into ${APP_FILE}"
          before=$(sha1sum "${APP_FILE}" | cut -d' ' -f1)
          # Insert an "image:" block immediately under the "webapi:" key in the
          # inline values. The indent (10 spaces) matches the surrounding YAML
          # produced by NIC's template.
          NEW_TAG="$NEW_TAG" perl -0777 -i -pe '
            s/^(        webapi:\n)(?!          image:)/$1."          image:\n            tag: \"$ENV{NEW_TAG}\"\n"/me;
          ' "${APP_FILE}"
          after=$(sha1sum "${APP_FILE}" | cut -d' ' -f1)
          if [[ "$before" == "$after" ]]; then
            echo "✗ patch left ${APP_FILE} unchanged — file content:"
            cat "${APP_FILE}"
            exit 1
          fi
          echo "  patched: ${APP_FILE}"
          echo "::endgroup::"

          echo "::group::Diff in GitOps repo"
          git -C "${GITOPS_DIR}" --no-pager diff || true
          echo "::endgroup::"

          echo "::group::Commit override to local file:// repo"
          if git -C "${GITOPS_DIR}" diff --quiet; then
            echo "✗ patch produced no changes — selectors did not match expected layout"
            exit 1
          fi
          git -C "${GITOPS_DIR}" \
            -c user.email=ci@e2e \
            -c user.name="e2e bot" \
            commit -am "ci: override webapi image tag to ${NEW_TAG} for e2e"
          echo "::endgroup::"

          echo "::group::Refresh ArgoCD nebari-landingpage Application"
          kubectl -n argocd annotate application nebari-landingpage \
            argocd.argoproj.io/refresh=hard --overwrite
          echo "::endgroup::"

          echo "::group::Wait for ArgoCD to apply the override to the deployment"
          # Poll until spec.image actually matches the PR tag. ArgoCD's sync
          # can take 3-4 min after the Git commit, and previously we exited
          # the loop too early — kubectl rollout status then reported on an
          # in-flight rollout that ArgoCD subsequently superseded, leaving
          # the running pods on the wrong image when the suite started.
          TARGET_IMAGE="quay.io/nebari/nebari-webapi:${NEW_TAG}"
          applied=false
          for i in $(seq 1 60); do
            cur=$(kubectl -n nebari-system get deployment nebari-landing-webapi \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="webapi")].image}' \
              2>/dev/null || echo "")
            if [[ "$cur" == "$TARGET_IMAGE" ]]; then
              echo "  ArgoCD applied the override (spec.image = $cur)"
              applied=true
              break
            fi
            echo "  attempt $i/60 — deployment image still '$cur', waiting 10s …"
            sleep 10
          done
          if ! $applied; then
            echo "✗ ArgoCD never applied the override; dumping Application state:"
            kubectl -n argocd get application nebari-landingpage -o yaml 2>/dev/null \
              | head -120 || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Wait for rollout to complete on the PR image"
          # Now that spec.image is fixed at the PR tag, this rollout-status
          # is guaranteed to wait on a rollout that produces PR-image pods.
          kubectl -n nebari-system rollout status \
            deployment/nebari-landing-webapi --timeout=5m
          echo "::endgroup::"

      # ── Read nebari realm admin password ─────────────────────────────────────
      # NIC creates nebari-realm-admin-credentials in the keycloak namespace
      # with a randomly-generated password (separate from the master realm admin
      # password output by the sandbox).  Read it here so the e2e tests can
      # authenticate against the nebari realm.
      - name: Read nebari realm admin password
        run: |
          PASS=$(kubectl -n keycloak get secret nebari-realm-admin-credentials \
            -o jsonpath='{.data.password}' | base64 -d)
          echo "::add-mask::${PASS}"
          echo "NEBARI_REALM_ADMIN_PASSWORD=${PASS}" >> "$GITHUB_ENV"

      # ── Patch Keycloak for the e2e suite (TEMPORARY WORKAROUND) ──────────────
      # Enables directAccessGrantsEnabled on the nebari-landing OIDC client and
      # creates the realm fixtures (test-user + admin group) that the suite
      # expects.  See .github/scripts/setup-keycloak-e2e.sh for full rationale
      # and the removal plan — this step goes away once nebari-operator gains
      # spec.auth.keycloakConfig.directAccessGrantsEnabled.
      - name: Patch Keycloak for e2e (temporary workaround)
        run: .github/scripts/setup-keycloak-e2e.sh --env-file "$GITHUB_ENV"

      # ── E2E suite ─────────────────────────────────────────────────────────────
      - name: Run e2e tests
        env:
          # Cluster is already running — skip Kind creation and docker build.
          USE_EXISTING_CLUSTER: "true"
          CLUSTER_TYPE: k3d
          K3D_CLUSTER_NAME: ${{ steps.sandbox.outputs.cluster-name }}
          # Password for the 'admin' user in the nebari realm (not the master realm).
          E2E_KEYCLOAK_ADMIN_PASSWORD: ${{ env.NEBARI_REALM_ADMIN_PASSWORD }}
          # Client secret for the operator-provisioned nebari-landing OIDC client.
          # Used by the e2e suite instead of admin-cli to acquire tokens with full
          # identity claims (sub, preferred_username, groups).
          E2E_OIDC_CLIENT_SECRET: ${{ env.E2E_OIDC_CLIENT_SECRET }}
        run: go test ./test/e2e/... -tags=e2e -v -timeout 10m
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pods (all namespaces) ==="
          kubectl get pods -A || true
          echo ""
          echo "=== Recent warning events ==="
          kubectl get events -A --field-selector type=Warning \
            --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
          echo ""
          echo "=== webapi logs ==="
          kubectl logs -n nebari-system \
            -l app.kubernetes.io/component=webapi --tail=100 || true
          echo ""
          echo "=== ArgoCD applications ==="
          kubectl get applications -n argocd -o wide || true

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}
          docker network rm ${{ steps.sandbox.outputs.network-name }} 2>/dev/null || true
