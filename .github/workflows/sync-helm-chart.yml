# Sync Helm Chart to nebari-dev/helm-repository
#
# When called by release.yml or run manually, this workflow:
#
#   1. Checks out the release tag and verifies Chart.yaml is already pinned to
#      it (version and appVersion both equal the tag minus its leading 'v').
#      release-prep.yaml writes that pin at tag time, so the chart is synced
#      exactly as tagged: no rewriting here. values.yaml image tags stay
#      empty and the deployment templates fall back to .Chart.AppVersion.
#   2. Opens a PR in nebari-dev/helm-repository via the sync-chart composite
#      action.  When that PR is merged the helm-repository CI packages and
#      publishes the chart to both GitHub Pages and quay.io/nebari-dev (OCI).
#
# Prerequisites (one-time maintainer setup):
#   A fine-grained PAT with contents+PR write access on nebari-dev/helm-repository
#   stored as the NEBARI_HELM_REPO_TOKEN organisation (or repository) secret.
#   See: https://github.com/nebari-dev/helm-repository/blob/main/.github/actions/sync-chart/README.md

name: Sync Helm Chart to nebari-dev/helm-repository

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.2.0)"
        required: true
        type: string
      dry-run:
        description: "Lint only; skip PR creation"
        required: false
        default: false
        type: boolean
    secrets:
      NEBARI_HELM_REPO_TOKEN:
        required: false

  # Allow manual runs from the Actions tab (useful for testing).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.2.0)"
        required: false
        default: ''
        type: string
      dry-run:
        description: "Lint only; skip PR creation"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Sync chart
    runs-on: ubuntu-latest

    permissions:
      contents: read  # to check out this repository

    steps:
      # ── Resolve the release tag ───────────────────────────────────────────
      # Called runs pass the release tag from release.yml. Manual runs use the
      # supplied 'tag' input so dry-run / manual testing works.
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "::error::No release tag found. Provide the 'tag' input (e.g. v0.2.0)."
            exit 1
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      # Check out the tag itself, not the dispatching ref: only the tag carries
      # the release-prep commit that pins Chart.yaml. A manual run dispatched
      # from main would otherwise sync main's `appVersion: "latest"`.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}

      # ── Verify the tagged chart is pinned; do not rewrite it ──────────────
      # Same check as release.yml's publish-chart job. It is repeated here
      # because this workflow can also be run on its own from the Actions tab.
      - name: Verify chart is pinned to release tag
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # `^` anchors skip the indented `version:` of the Redis dependency.
          CHART_VERSION=$(awk '/^version:/ {print $2}' charts/nebari-landing/Chart.yaml)
          APP_VERSION=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/nebari-landing/Chart.yaml)
          echo "tag=$TAG  expected=$VERSION  version=$CHART_VERSION  appVersion=$APP_VERSION"
          if [[ "$CHART_VERSION" != "$VERSION" || "$APP_VERSION" != "$VERSION" ]]; then
            echo "::error::Chart.yaml at $TAG is not pinned to $VERSION. Cut the tag with the release-prep workflow."
            exit 1
          fi

      # ── Update chart dependencies ─────────────────────────────────────────
      - name: Install Helm
        if: ${{ inputs['dry-run'] != true }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Update Helm dependencies
        if: ${{ inputs['dry-run'] != true }}
        run: helm dependency update charts/nebari-landing

      # ── Sync to nebari-dev/helm-repository ────────────────────────────────
      # NOTE: Pinned to a specific commit instead of @main to avoid breaking changes.
      # If this action fails, check https://github.com/nebari-dev/helm-repository
      # for updates and update the commit SHA below.
      - name: Sync chart to helm-repository
        if: ${{ inputs['dry-run'] != true }}
        uses: nebari-dev/helm-repository/.github/actions/sync-chart@50e534337149dd70209a14047c2cbbb3319f074d # main
        with:
          chart-path: charts/nebari-landing
          token: ${{ secrets.NEBARI_HELM_REPO_TOKEN }}
          pr-labels: 'automated,helm-sync'

      # ── Dry-run path: lint only ────────────────────────────────────────────
      - name: Install Helm (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Update Helm dependencies (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        run: helm dependency update charts/nebari-landing

      - name: Lint chart (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        run: helm lint charts/nebari-landing
