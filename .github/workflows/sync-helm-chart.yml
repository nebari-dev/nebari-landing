# Sync Helm Chart to nebari-dev/helm-repository
#
# When called by release.yml or run manually, this workflow:
#
#   1. Bumps Chart.yaml version + appVersion to match the release tag.
#   2. Pins nebari image digests (quay.io/nebari/*) in values.yaml to the
#      release manifest digests.
#   3. Opens a PR in nebari-dev/helm-repository via the sync-chart composite
#      action.  When that PR is merged the helm-repository CI packages and
#      publishes the chart to both GitHub Pages and quay.io/nebari-dev (OCI).
#
# Prerequisites (one-time maintainer setup):
#   A fine-grained PAT with contents+PR write access on nebari-dev/helm-repository
#   stored as the NEBARI_HELM_REPO_TOKEN organisation (or repository) secret.
#   See: https://github.com/nebari-dev/helm-repository/blob/main/.github/actions/sync-chart/README.md

name: Sync Helm Chart to nebari-dev/helm-repository

env:
  HELM_VERSION: v3.21.3

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.2.0)"
        required: true
        type: string
      webapi-digest:
        description: "Immutable digest for the released webapi manifest"
        required: true
        type: string
      frontend-digest:
        description: "Immutable digest for the released frontend manifest"
        required: true
        type: string
      dry-run:
        description: "Lint only; skip PR creation"
        required: false
        default: false
        type: boolean
    secrets:
      NEBARI_HELM_REPO_TOKEN:
        required: false

  # Allow manual runs from the Actions tab (useful for testing).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.2.0)"
        required: false
        default: ''
        type: string
      webapi-digest:
        description: "Immutable digest for the released webapi manifest"
        required: false
        default: ''
        type: string
      frontend-digest:
        description: "Immutable digest for the released frontend manifest"
        required: false
        default: ''
        type: string
      dry-run:
        description: "Lint only; skip PR creation"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Sync chart
    runs-on: ubuntu-24.04
    environment: release

    permissions:
      contents: read  # to check out this repository

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # ── Resolve the release tag ───────────────────────────────────────────
      # Called runs pass the release tag from release.yml. Manual runs use the
      # supplied 'tag' input so dry-run / manual testing works.
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No release tag found. Provide the 'tag' input (e.g. v0.2.0)."
            exit 1
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      # ── Bump chart version to the release tag ─────────────────────────────
      - name: Bump chart version to release tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VERSION="${TAG#v}"   # strip leading 'v', e.g. v1.2.3 → 1.2.3

          sed -i "s/^version:.*/version: ${VERSION}/" charts/nebari-landing/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/nebari-landing/Chart.yaml

          echo "Chart version  → ${VERSION}"
          echo "Chart appVersion → ${VERSION}"

      # ── Pin nebari image digests; leave third-party images alone ──────────
      - name: Pin nebari image digests in values.yaml
        if: ${{ inputs['dry-run'] != true }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              "frontend": "${{ inputs['frontend-digest'] }}",
              "webapi": "${{ inputs['webapi-digest'] }}",
          }
          for name, digest in targets.items():
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"{name} digest must start with sha256:")

          path = Path("charts/nebari-landing/values.yaml")
          lines = path.read_text().splitlines()
          section = None
          in_image = False
          image_indent = None
          seen = set()

          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = len(line) - len(line.lstrip(" "))

              if stripped and indent == 0 and stripped.endswith(":"):
                  section = stripped[:-1]
                  in_image = False
                  image_indent = None

              if section in targets and stripped == "image:" and indent == 2:
                  in_image = True
                  image_indent = indent
                  continue

              if in_image:
                  if stripped and indent <= image_indent:
                      in_image = False
                      image_indent = None
                      continue
                  if stripped.startswith("digest:"):
                      prefix = line[:indent]
                      lines[i] = f'{prefix}digest: "{targets[section]}"'
                      seen.add(section)

          missing = set(targets) - seen
          if missing:
              raise SystemExit(f"missing digest fields for: {', '.join(sorted(missing))}")
          path.write_text("\n".join(lines) + "\n")
          print("values.yaml updated with release digests")
          PY

      # ── Update chart dependencies ─────────────────────────────────────────
      - name: Install Helm
        if: ${{ inputs['dry-run'] != true }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build Helm dependencies
        if: ${{ inputs['dry-run'] != true }}
        run: helm dependency build charts/nebari-landing

      # ── Sync to nebari-dev/helm-repository ────────────────────────────────
      # NOTE: Pinned to a specific commit instead of @main to avoid breaking changes.
      # If this action fails, check https://github.com/nebari-dev/helm-repository
      # for updates and update the commit SHA below.
      - name: Sync chart to helm-repository
        if: ${{ inputs['dry-run'] != true }}
        uses: nebari-dev/helm-repository/.github/actions/sync-chart@50e534337149dd70209a14047c2cbbb3319f074d # main
        with:
          chart-path: charts/nebari-landing
          token: ${{ secrets.NEBARI_HELM_REPO_TOKEN }}
          pr-labels: 'automated,helm-sync'

      # ── Dry-run path: lint only ────────────────────────────────────────────
      - name: Install Helm (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build Helm dependencies (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        run: helm dependency build charts/nebari-landing

      - name: Lint chart (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        run: helm lint charts/nebari-landing
