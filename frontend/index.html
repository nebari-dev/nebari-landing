<!doctype html>
<html lang="en">
  <head>
    <!-- Pre-paint theme bootstrap: generated by themeBootstrapScript("launchpad:themeMode")
         from @nebari/use-theme-preference (src/hooks/use-theme-preference.ts). -->
    <script>
(function () {
  var mode = null;
  var prefersDark = false;
  try {
    mode = localStorage.getItem("launchpad:themeMode");
  } catch (e) {}
  try {
    prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  } catch (e) {}
  var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
  try {
    document.documentElement.classList.toggle('dark', isDark);
  } catch (e) {}
})();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebari | Launchpad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
