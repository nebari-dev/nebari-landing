# GoReleaser configuration for the nebari-landing webapi binary.
#
# Builds the Go webapi (cmd/main.go) for Linux and macOS (amd64 + arm64).
# Triggered by the Release workflow; artifacts are attached to the GitHub release.
#
# Local snapshot test:
#   goreleaser release --snapshot --clean
version: 2

project_name: nebari-landing

before:
  hooks:
    - go mod tidy

builds:
  - id: webapi
    main: ./cmd/main.go
    binary: nebari-webapi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: webapi
    builds: [webapi]
    name_template: "nebari-webapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  # Update the existing GitHub release (created by the release event trigger)
  # instead of creating a new one.
  github:
    owner: nebari-dev
    name: nebari-landing
  # GoReleaser writes `prerelease` onto the existing release rather than
  # inheriting it, and its default is false: v0.1.6-rc.2 was published as a
  # pre-release and came out of this job as a full release. `auto` derives it
  # from the tag (v0.2.0-rc.1 -> pre-release, v0.2.0 -> release), matching
  # what release.yml's prepare job sets.
  prerelease: auto
