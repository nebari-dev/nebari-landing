apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebari-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebari-operator
  template:
    metadata:
      labels:
        app: nebari-operator
    spec:
      containers:
      - name: nebari-operator
        image: nebari-operator:latest
        env:
        - name: FORWARD_ACCESS_TOKEN
          valueFrom:
            configMapKeyRef:
              name: nebari-landing-config
              key: forward-access-token
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nebari-landing-config
data:
  forward-access-token: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: nebari-landing-secret
type: Opaque
data:
  forward-access-token: <base64 encoded value of "true">