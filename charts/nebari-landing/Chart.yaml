apiVersion: v2
name: nebari-landing
description: >
  Nebari Landing Page — React/keycloak-js SPA served by nginx +
  Go webapi backend, backed by Redis for pins, notifications,
  access requests, WebSocket fan-out, and WebSocket auth tickets.
type: application
version: 0.1.0
# On main, appVersion is "latest" so source consumers (e.g. ArgoCD pointing
# at a non-release commit) resolve to the floating :latest image tag, which
# always points at main's most recent webapi/frontend build on Quay.
#
# At release time, the release-prep workflow
# (.github/workflows/release-prep.yaml) replaces this with the release
# version (e.g. "0.1.0-alpha.6") on a dedicated release branch, commits the
# bump, and tags it. Consumers checking out the tag see appVersion pinned
# to a real image tag.
#
# Image tags themselves are left empty in values.yaml so the deployment
# templates fall back to .Chart.AppVersion. See values.yaml.
appVersion: "latest"
maintainers:
  - name: OpenTeams
    url: https://github.com/nebari-dev

dependencies:
  - name: redis
    version: "23.1.1"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
