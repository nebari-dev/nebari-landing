components:
  schemas:
    accessrequests.AccessRequest:
      properties:
        id:
          description: ID is the UUIDv4 primary key, generated by Create().
          type: string
        message:
          description: Message is an optional free-text note from the requester.
          type: string
        requestedAt:
          description: RequestedAt is the UTC timestamp when the request was created.
          type: string
        resolvedAt:
          description: ResolvedAt is set when the request is approved or denied.
          type: string
        resolvedBy:
          description: ResolvedBy is the admin username who approved or denied the
            request.
          type: string
        serviceName:
          description: ServiceName is the human-readable name of the service at request
            time.
          type: string
        serviceUID:
          description: ServiceUID is the Kubernetes UID of the target NebariApp.
          type: string
        status:
          $ref: '#/components/schemas/accessrequests.Status'
        userEmail:
          description: UserEmail is included when present in the JWT claims.
          type: string
        userID:
          description: UserID is the caller's preferred_username (or JWT sub fallback).
          type: string
      type: object
    accessrequests.Status:
      description: Status is the current lifecycle state.
      enum:
      - pending
      - approved
      - denied
      type: string
      x-enum-varnames:
      - StatusPending
      - StatusApproved
      - StatusDenied
    api.AdminError:
      properties:
        error:
          type: string
        services:
          description: |-
            Services lists the service ids that still reference a group when a
            delete is refused with 409.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.AdminGroupInput:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    api.AdminOverview:
      properties:
        accessRequests:
          $ref: '#/components/schemas/api.OverviewAccessRequests'
        accessRequestsAvailable:
          description: AccessRequestsAvailable is false when the access-request store
            is off.
          type: boolean
        activeSessions:
          description: |-
            ActiveSessions is Keycloak's count of live sessions across clients, or
            null when it could not be read.
          type: integer
        generatedAt:
          type: string
        groups:
          type: integer
        identityAvailable:
          description: |-
            IdentityAvailable is false when no Keycloak admin client is configured;
            user/group/role/session figures are then zero.
          type: boolean
        roles:
          type: integer
        services:
          $ref: '#/components/schemas/api.OverviewServices'
        users:
          $ref: '#/components/schemas/api.OverviewUsers'
      type: object
    api.AdminRoleInput:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    api.AdminService:
      properties:
        category:
          type: string
        displayName:
          type: string
        health:
          $ref: '#/components/schemas/api.AdminServiceHealth'
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        requiredGroups:
          items:
            type: string
          type: array
          uniqueItems: false
        url:
          type: string
        visibility:
          type: string
      type: object
    api.AdminServiceHealth:
      description: |-
        Health is the latest probe outcome plus a summary of the retained
        history; nil when the service has no health check.
      properties:
        lastCheck:
          type: string
        message:
          type: string
        samples:
          description: Samples is how many probes the window holds.
          type: integer
        status:
          type: string
        streakSince:
          type: string
        streakStatus:
          description: |-
            StreakStatus / StreakSince describe the run of identical outcomes that
            ends with the latest sample.
          type: string
        uptimePercent:
          description: |-
            UptimePercent is the share of samples that were healthy, or nil when
            there are no samples.
          type: number
        windowStart:
          description: WindowStart is the oldest sample's time, when any exist.
          type: string
      type: object
    api.AdminServiceHealthHistory:
      properties:
        history:
          description: History lists the retained probe samples, oldest first.
          items:
            $ref: '#/components/schemas/cache.HealthSample'
          type: array
          uniqueItems: false
        lastCheck:
          type: string
        message:
          type: string
        samples:
          description: Samples is how many probes the window holds.
          type: integer
        status:
          type: string
        streakSince:
          type: string
        streakStatus:
          description: |-
            StreakStatus / StreakSince describe the run of identical outcomes that
            ends with the latest sample.
          type: string
        uptimePercent:
          description: |-
            UptimePercent is the share of samples that were healthy, or nil when
            there are no samples.
          type: number
        windowStart:
          description: WindowStart is the oldest sample's time, when any exist.
          type: string
      type: object
    api.AdminUserPatch:
      properties:
        enabled:
          type: boolean
      type: object
    api.AdminUsersResponse:
      properties:
        total:
          type: integer
        users:
          items:
            $ref: '#/components/schemas/keycloak.IdentityUser'
          type: array
          uniqueItems: false
      type: object
    api.BulkUsersRequest:
      properties:
        action:
          description: Action is one of addToGroup, removeFromGroup, assignRole, unassignRole,
            enable, disable.
          type: string
        groupId:
          type: string
        role:
          type: string
        userIds:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.BulkUsersResponse:
      properties:
        updated:
          type: integer
      type: object
    api.CallerIdentityResponse:
      properties:
        authenticated:
          type: boolean
        email:
          type: string
        groups:
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          type: string
        username:
          type: string
      type: object
    api.CreateNotificationBody:
      properties:
        image:
          type: string
        message:
          type: string
        title:
          type: string
      type: object
    api.HealthResponse:
      properties:
        status:
          example: healthy
          type: string
      type: object
    api.NotificationItem:
      properties:
        createdAt:
          type: string
        id:
          type: string
        image:
          type: string
        message:
          type: string
        read:
          type: boolean
        title:
          type: string
      type: object
    api.OverviewAccessRequests:
      properties:
        approved:
          type: integer
        denied:
          type: integer
        pending:
          type: integer
      type: object
    api.OverviewServices:
      properties:
        gated:
          type: integer
        healthy:
          type: integer
        public:
          type: integer
        total:
          type: integer
        unhealthy:
          type: integer
        unknown:
          type: integer
      type: object
    api.OverviewUsers:
      properties:
        createdLast7Days:
          type: integer
        disabled:
          type: integer
        enabled:
          type: integer
        total:
          type: integer
        withoutGroups:
          type: integer
      type: object
    api.PinsResponse:
      properties:
        pins:
          description: Pins is the ordered list of pinned services (cached ServiceInfo
            snapshots).
          items:
            $ref: '#/components/schemas/cache.ServiceInfo'
          type: array
          uniqueItems: false
        uids:
          description: |-
            UIDs lists exactly which UIDs are stored, including those that are no longer
            cached (e.g. the NebariApp was deleted).
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.RequestAccessBody:
      properties:
        message:
          description: optional free-text note from the user
          type: string
      type: object
    api.ServiceResponse:
      properties:
        services:
          items:
            $ref: '#/components/schemas/api.ServiceView'
          type: array
          uniqueItems: false
      type: object
    api.ServiceView:
      properties:
        category:
          items:
            type: string
          type: array
          uniqueItems: false
        description:
          type: string
        id:
          type: string
        image:
          type: string
        imageDark:
          type: string
        imageLight:
          type: string
        name:
          type: string
        pinned:
          type: boolean
        status:
          type: string
        url:
          type: string
      type: object
    api.WSTicketResponse:
      properties:
        ticket:
          type: string
      type: object
    cache.HealthSample:
      properties:
        at:
          type: string
        status:
          type: string
      type: object
    cache.HealthStatus:
      properties:
        lastCheck:
          type: string
        message:
          type: string
        status:
          description: healthy, unhealthy, unknown
          type: string
      type: object
    cache.ServiceInfo:
      properties:
        category:
          type: string
        description:
          type: string
        displayName:
          type: string
        health:
          $ref: '#/components/schemas/cache.HealthStatus'
        icon:
          type: string
        iconDark:
          type: string
        iconLight:
          type: string
        name:
          type: string
        namespace:
          type: string
        priority:
          type: integer
        requiredGroups:
          items:
            type: string
          type: array
          uniqueItems: false
        uid:
          type: string
        url:
          type: string
        visibility:
          type: string
      type: object
    keycloak.IdentityGroup:
      properties:
        createdAt:
          type: string
        description:
          description: |-
            Description is stored as the "description" group attribute; Keycloak
            groups have no first-class description field.
          type: string
        id:
          type: string
        name:
          type: string
        path:
          type: string
        roles:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    keycloak.IdentityRole:
      properties:
        builtIn:
          description: BuiltIn marks Keycloak-managed roles that the UI must not edit.
          type: boolean
        composite:
          type: boolean
        description:
          type: string
        name:
          type: string
      type: object
    keycloak.IdentityUser:
      properties:
        createdAt:
          type: string
        email:
          type: string
        enabled:
          type: boolean
        firstName:
          type: string
        groups:
          description: Groups holds the ids of the groups the user is a direct member
            of.
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
        lastName:
          type: string
        lastSignInAt:
          description: |-
            LastSignInAt is not exposed by the Keycloak user representation (it lives
            in the events store), so it is always null for now.
          type: string
        roles:
          description: Roles holds realm role names mapped directly to the user.
          items:
            type: string
          type: array
          uniqueItems: false
        username:
          type: string
      type: object
    notifications.Notification:
      properties:
        createdAt:
          description: CreatedAt is the UTC timestamp when the notification was created.
          type: string
        id:
          description: ID is the UUIDv4 primary key, generated by Create().
          type: string
        image:
          description: Image is an optional URL or icon identifier shown in the notification
            card.
          type: string
        message:
          description: Message is the body text of the notification.
          type: string
        requiredGroups:
          description: |-
            RequiredGroups mirrors ServiceInfo.RequiredGroups when the source
            service is private. Consumed by canAccessPolicy.
          items:
            type: string
          type: array
          uniqueItems: false
        serviceUid:
          description: |-
            ServiceUID, when non-empty, ties this notification to a specific
            NebariApp for per-caller access filtering. Producer sites (watcher
            lifecycle events, health-checker transitions) populate this from the
            source ServiceInfo; admin-created broadcast notifications leave it
            empty and route through the fan-out-to-all path.
          type: string
        title:
          description: Title is the short heading of the notification.
          type: string
        visibility:
          description: |-
            Visibility mirrors ServiceInfo.Visibility for the source service:
            "public" | "private" | "" (untagged). Consumed by canAccessPolicy.
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Keycloak-issued JWT, sent as "Bearer <token>".
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Service-discovery and notifications API consumed by the nebari-landing SPA.
    Spec is published only when the server is started with --enable-docs (off in production).
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Nebari Landing Page API
  version: v1
openapi: 3.1.0
paths:
  /admin/access-requests:
    get:
      description: Returns access requests across the cluster. Admin-only — caller's
        JWT must include the configured admin group.
      parameters:
      - description: 'Filter by status: pending, approved, or denied'
        in: query
        name: status
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/accessrequests.AccessRequest'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: 'Forbidden: admin group required'
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Access request feature not configured
      security:
      - BearerAuth: []
      summary: List access requests (admin)
      tags:
      - admin
  /admin/access-requests/{id}/{action}:
    put:
      description: 'Action is encoded in the URL: PUT .../{id}/approve or .../{id}/deny.
        Approving also adds the user to the service''s required Keycloak groups when
        a Keycloak admin client is configured.'
      parameters:
      - description: Access request ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: approve | deny
        in: path
        name: action
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accessrequests.AccessRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: 'Forbidden: admin group required'
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Request not found
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Access request feature not configured
      security:
      - BearerAuth: []
      summary: Approve or deny an access request (admin)
      tags:
      - admin
  /admin/groups:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/keycloak.IdentityGroup'
                type: array
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Implemented
      security:
      - BearerAuth: []
      summary: List groups (admin)
      tags:
      - admin
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.AdminGroupInput'
                description: Group name (lowercase, digits, dashes) and description
                summary: body
        description: Group name (lowercase, digits, dashes) and description
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Group already exists
      security:
      - BearerAuth: []
      summary: Create a top-level group (admin)
      tags:
      - admin
  /admin/groups/{id}:
    delete:
      description: Refused with 409 while any landing-page service lists the group
        under spec.auth.groups in its NebariApp; remove it from the CR first.
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Group is referenced by a service gate
      security:
      - BearerAuth: []
      summary: Delete a group (admin)
      tags:
      - admin
    get:
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get a group (admin)
      tags:
      - admin
    patch:
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.AdminGroupInput'
                description: New description
                summary: body
        description: New description
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Update a group's description (admin)
      tags:
      - admin
  /admin/groups/{id}/members/{userId}:
    delete:
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Keycloak user id
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Add or remove a group member (admin)
      tags:
      - admin
    put:
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Keycloak user id
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Add or remove a group member (admin)
      tags:
      - admin
  /admin/groups/{id}/roles/{role}:
    delete:
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Realm role name
        in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Map or unmap a realm role on a group (admin)
      tags:
      - admin
    put:
      parameters:
      - description: Keycloak group id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Realm role name
        in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityGroup'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Map or unmap a realm role on a group (admin)
      tags:
      - admin
  /admin/notifications:
    post:
      description: Creates a new platform-wide notification visible to all users via
        GET /notifications. Admin-only.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.CreateNotificationBody'
                description: Notification payload
                summary: body
        description: Notification payload
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notifications.Notification'
          description: Created
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: 'Forbidden: admin group required'
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Notifications feature not configured
      security:
      - BearerAuth: []
      summary: Create a notification (admin)
      tags:
      - admin
  /admin/overview:
    get:
      description: 'Headline counts for the admin dashboard: accounts, groups, roles,
        service health and gates, access requests by status, and live Keycloak sessions.
        Figures that depend on an unavailable backend are zero and flagged via the
        *Available booleans. Admin-only.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminOverview'
          description: OK
        "403":
          content:
            application/json:
              schema:
                type: string
          description: 'Forbidden: admin group required'
      security:
      - BearerAuth: []
      summary: Admin overview figures
      tags:
      - admin
  /admin/roles:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/keycloak.IdentityRole'
                type: array
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Implemented
      security:
      - BearerAuth: []
      summary: List realm roles (admin)
      tags:
      - admin
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.AdminRoleInput'
                description: Role name and description
                summary: body
        description: Role name and description
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityRole'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Role already exists
      security:
      - BearerAuth: []
      summary: Create a realm role (admin)
      tags:
      - admin
  /admin/roles/{name}:
    delete:
      parameters:
      - description: Realm role name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Built-in roles cannot be deleted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Delete a realm role (admin)
      tags:
      - admin
    patch:
      parameters:
      - description: Realm role name
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.AdminRoleInput'
                description: New description
                summary: body
        description: New description
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityRole'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Built-in roles cannot be edited
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Update a realm role's description (admin)
      tags:
      - admin
  /admin/services:
    get:
      description: 'Every landing-page service with the gate derived from its NebariApp
        spec.auth (visibility + requiredGroups). Read-only: the CR is the source of
        truth. Does not require a Keycloak admin client.'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/api.AdminService'
                type: array
          description: OK
        "403":
          content:
            application/json:
              schema:
                type: string
          description: 'Forbidden: admin group required'
      security:
      - BearerAuth: []
      summary: List service access gates (admin)
      tags:
      - admin
  /admin/services/{id}:
    get:
      parameters:
      - description: Service UID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminService'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get a service access gate (admin)
      tags:
      - admin
  /admin/services/{id}/health:
    get:
      description: Latest probe outcome, uptime over the retained window, the current
        streak, and every retained sample (about 24h at the default probe interval;
        in-memory, reset on webapi restart).
      parameters:
      - description: Service UID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminServiceHealthHistory'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Service health history (admin)
      tags:
      - admin
  /admin/users:
    get:
      description: 'Returns every realm user with direct group ids and realm roles.
        Optional filters: q (name/username/email substring), group (group id), role
        (realm role), enabled (true|false). Admin-only.'
      parameters:
      - description: Substring match on name, username or email
        in: query
        name: q
        schema:
          type: string
      - description: Only users in this group id
        in: query
        name: group
        schema:
          type: string
      - description: Only users with this direct realm role
        in: query
        name: role
        schema:
          type: string
      - description: Filter by enabled flag
        in: query
        name: enabled
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminUsersResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: 'Forbidden: admin group required'
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Keycloak admin client not configured
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Keycloak request failed
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /admin/users/{id}:
    delete:
      description: Permanently deletes the realm user together with their group memberships,
        role mappings and sessions. Admins cannot delete their own account.
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Cannot delete your own account
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Delete a user (admin)
      tags:
      - admin
    get:
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityUser'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get a user (admin)
      tags:
      - admin
    patch:
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.AdminUserPatch'
                description: Fields to change
                summary: body
        description: Fields to change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityUser'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Enable or disable a user (admin)
      tags:
      - admin
  /admin/users/{id}/groups/{groupId}:
    delete:
      description: PUT adds the user to the group; DELETE removes them. Both are idempotent.
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Keycloak group id
        in: path
        name: groupId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityUser'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Add or remove a user's group membership (admin)
      tags:
      - admin
    put:
      description: PUT adds the user to the group; DELETE removes them. Both are idempotent.
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Keycloak group id
        in: path
        name: groupId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityUser'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Add or remove a user's group membership (admin)
      tags:
      - admin
  /admin/users/{id}/roles/{role}:
    delete:
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Realm role name
        in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityUser'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Assign or unassign a direct realm role (admin)
      tags:
      - admin
    put:
      parameters:
      - description: Keycloak user id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Realm role name
        in: path
        name: role
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keycloak.IdentityUser'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Assign or unassign a direct realm role (admin)
      tags:
      - admin
  /admin/users/bulk:
    post:
      description: 'Actions: addToGroup / removeFromGroup (need groupId), assignRole
        / unassignRole (need role), enable, disable. Users that fail are skipped and
        counted out of `updated`.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.BulkUsersRequest'
                description: Users and action
                summary: body
        description: Users and action
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.BulkUsersResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AdminError'
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Apply one change to many users (admin)
      tags:
      - admin
  /caller-identity:
    get:
      description: 'Echoes the resolved JWT claims for the caller. Returns {"authenticated":
        false} when no valid token is present.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CallerIdentityResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
      security:
      - BearerAuth: []
      summary: Get the caller's identity
      tags:
      - identity
  /categories:
    get:
      description: Returns the distinct set of category labels currently advertised
        by services in the cache. Public — no auth required.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
          description: OK
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
      summary: List service categories
      tags:
      - services
  /health:
    get:
      description: Returns {"status":"healthy"} as long as the server is up. Does
        not check downstream dependencies.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.HealthResponse'
          description: OK
      summary: Liveness probe
      tags:
      - health
  /notifications:
    get:
      description: Returns all platform notifications. When the caller is authenticated,
        each item's "read" flag reflects that user's per-notification read state;
        for anonymous callers all items are reported as unread.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/api.NotificationItem'
                type: array
          description: OK
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal server error
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - notifications
  /notifications/{id}/read:
    put:
      description: Marks the specified notification as read for the calling user.
        Idempotent — returns 204 even if already read.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Notification not found
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Notifications feature not configured
      security:
      - BearerAuth: []
      summary: Mark a notification as read
      tags:
      - notifications
  /pins:
    get:
      description: Returns the caller's pinned services. UIDs is the raw stored list;
        Pins is the subset still resolvable in the live cache (so deleted services
        are gracefully filtered out).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.PinsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal server error
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Pins feature not configured
      security:
      - BearerAuth: []
      summary: List the caller's pins
      tags:
      - pins
  /pins/{uid}:
    delete:
      description: PUT pins the service; DELETE unpins. Both operations are idempotent.
        The UID is the NebariApp UID exposed at status.serviceDiscovery.
      parameters:
      - description: NebariApp UID
        in: path
        name: uid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: UID is required
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal server error
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Pins feature not configured
      security:
      - BearerAuth: []
      summary: Pin or unpin a service
      tags:
      - pins
    put:
      description: PUT pins the service; DELETE unpins. Both operations are idempotent.
        The UID is the NebariApp UID exposed at status.serviceDiscovery.
      parameters:
      - description: NebariApp UID
        in: path
        name: uid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: UID is required
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal server error
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Pins feature not configured
      security:
      - BearerAuth: []
      summary: Pin or unpin a service
      tags:
      - pins
  /services:
    get:
      description: |-
        Returns the union of public services plus any private services the caller may access based on their JWT groups.
        Anonymous callers see public services only; bearer-token callers additionally see private services they have access to. The "pinned" flag reflects the caller's own pin list (always false for anonymous).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ServiceResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
      security:
      - BearerAuth: []
      summary: List discoverable services
      tags:
      - services
  /services/{id}:
    get:
      description: Returns the service if the caller may access it. Anonymous callers
        may only fetch public services; private services require a JWT whose groups
        intersect the service's required groups.
      parameters:
      - description: Service UID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ServiceView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Service ID is required
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Service not found
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
      security:
      - BearerAuth: []
      summary: Get a service by UID
      tags:
      - services
  /services/{id}/request_access:
    post:
      description: Requires authentication. Creates a pending access request for the
        caller against the named service; an admin then approves or denies via /admin/access-requests/{id}/{approve|deny}.
      parameters:
      - description: Service UID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/api.RequestAccessBody'
                description: Optional message from the requester
                summary: body
        description: Optional message from the requester
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accessrequests.AccessRequest'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Service not found
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method not allowed
        "409":
          content:
            application/json:
              schema:
                type: string
          description: Pending request already exists
        "501":
          content:
            application/json:
              schema:
                type: string
          description: Access request feature not configured
      security:
      - BearerAuth: []
      summary: Request access to a private service
      tags:
      - services
  /ws:
    get:
      description: 'Upgrade to WebSocket. Server pushes JSON envelopes for service
        add/update/delete and new notifications. Auth is required before the upgrade:
        send `Authorization: Bearer <token>` or pass `?ticket=<id>` from POST /api/v1/ws-ticket
        (browsers must use the ticket path).'
      parameters:
      - description: Single-use ticket from POST /api/v1/ws-ticket (required for browser
          clients)
        in: query
        name: ticket
        schema:
          type: string
      responses:
        "101":
          content:
            application/json:
              schema:
                type: string
          description: Switching Protocols
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: 'WebSocket: real-time service + notification events'
      tags:
      - websocket
  /ws-ticket:
    post:
      description: Mints a short-lived (~30 s) single-use ticket the browser passes
        as `?ticket=<id>` on the WebSocket upgrade request, since the WS spec forbids
        sending an Authorization header on the upgrade. Requires a Bearer JWT.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.WSTicketResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method Not Allowed
        "501":
          content:
            application/json:
              schema:
                type: string
          description: WebSocket ticket exchange not configured
      security:
      - BearerAuth: []
      summary: Issue a single-use WebSocket ticket
      tags:
      - websocket
servers:
- url: /api/v1
